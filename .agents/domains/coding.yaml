domain_coding:
  scope: "File edits, creation, refactoring, debugging, and local verification."
  load_when:
    - "intent=coding"
    - "edit_file capability is needed"
    - "tests, builds, or linters are needed after code changes"
  rules:
    serena:
      default: "Use Serena MCP as the semantic code-intelligence layer for every code-related task unless the user opts out."
      activation: "Activate the current repository and read Serena's initial instructions before broad exploration or edits; reuse the active project when it already matches."
      semantic_scope: "Prefer symbol overviews, symbol lookup, references, implementations, call/dependency understanding, rename/refactor scope, and the smallest useful symbol body."
      native_scope: "Use rg first for exact text/path and non-code search, shell for builds/tests/linters, and apply_patch when required by the active edit policy."
      editing: "When policy permits Serena editing, prefer symbol-level edits for semantic refactors; otherwise use Serena to establish scope and apply the change with the required edit tool."
      fallback: "After one targeted recovery attempt, fall back when Serena is unavailable, activation fails, or the language/artifact is unsupported; report the gap without blocking safe work."
      memory: "Do not create duplicate Serena memories unless the user explicitly requests them; follow the project memory contract."
    targeted_read: "Verify exact local context before editing. Use line-numbered excerpts when line references matter."
    edit_precision:
      preferred: "Use structured patch/edit tools."
      scope: "Keep changes limited to files and behavior required by the task."
      preserve: "Do not rewrite unrelated formatting, metadata, or user changes."
    imports: "Keep imports sorted according to project style and remove unused imports when touched."
    project_patterns: "Prefer existing helpers, conventions, test tools, and architecture over new abstractions."
    comments: "Add comments only where they clarify non-obvious behavior."
    validation: "Run targeted checks after edits; broaden when the edited surface is shared or high risk."
    dirty_tree: "If version control exists and unrelated user changes are present, work around them without reverting."

compression_points:
  after_large_read: "Summarize relevant facts instead of retaining full file content."
  after_edit_batch: "Record touched files and behavioral intent in warm memory when multi-step."
  after_validation: "Record command/check result and unresolved gaps."

frontend_extra:
  trigger: "frontend UI, visual refactor, dashboard, or Tailwind work"
  mandatory_review_gate:
    skills:
      - "./.agents/skills/impeccable/SKILL.md"
      - "design-taste-frontend"
      - "finesse-ui"
    timing: "Complete and record the three-way review before any frontend or UI edit."
    decision: "Resolve hierarchy, component ownership, responsive behavior, accessibility, and validation scope before implementation."
    enforcement: "If any required skill cannot be loaded, stop the UI edit and report the missing gate instead of silently falling back."
  implementation: "Follow the agreed review; prefer shared components, flat hierarchy, progressive disclosure, and one legitimate surface boundary over nested cards."
  validation: "After changes, run the bundled Impeccable detector plus authenticated browser checks for every affected state and breakpoint."
  additional_context: "Load ./FRONTEND_RULES.md when present and preserve established project tokens and component conventions."
