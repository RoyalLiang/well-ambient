ai:
    enabled: true
    provider: Pixel
    base_url: https://sub2.congmingai.com
    endpoint_type: completions
    api_token: ""
    model: gpt-5.5
    project_architecture: well-ambient 是研发协同与 AI 需求解构平台；当前补充的业务上下文仅限路径规划模块。路径规划模块面向自动驾驶/无人车/港口堆场现场的领航长路径、推荐短路径、道路/区域约束、交通权重、特殊作业场景和现场定制能力。来源归档：docs/ai-context/path-planning-module.md。AI 解析时必须先判断需求是否属于路径规划模块，不能把该清单误认为协同平台全系统能力。
    delivery_workflow: 路径规划需求进入 Deconstructor 后，应先识别功能归属（标准功能/扩展能力/进阶探索/定制化功能）、当前状态（已耐久/已初步验证/已开发完成/开发中/待开发/未标注）、是否可配置、涉及现场项目与验证场景；随后输出配置项或代码改造任务、现场适配任务、仿真/回归/现场验证任务，并把缺失信息进入 meeting_questions。
    implemented_features: 路径规划模块第一个 sheet 共 39 项能力：标准功能 13、扩展能力 23、进阶探索 2、定制化功能 1；已耐久 20、已初步验证 7、已开发完成 3、开发中 3、待开发 5、未标注 1；可配置 25、不可配置 12、未明确 2。已耐久核心包括领航长路径、短路径可行区域、规避死锁、道路权重偏好、vpb 选择、取消领航、优先级行驶路权、删除幽灵车、禁行区、禁停区、流量控制区域、拖挂模型适配等；扩展包括点路径表示、短路径前后继、大小弯、倒车点路径、白名单禁行区、双向道路、电子围栏、路径回收、潮汐车道、倒箱门、车道通行方向、禁用道路、短路径车速、车级红绿灯、锁站、cutin/cutout、途径点、灵活上下岸桥、卡车倒车上报、堆场顺序作业、转场禁行区、动态调整道路、ETA 等。
    estimation_guidelines: 以小时为主估算。已耐久能力按配置、现场适配、联调、仿真/现场回归和验收估算，不按从零开发估算；已初步验证/已开发完成能力重点估算现场反馈闭环、测试覆盖、配置治理和回归风险；开发中/待开发/进阶探索能力需包含方案设计、实现、仿真、现场验证、回滚方案和多现场差异。可配置能力必须输出配置项、默认值/取值范围、作用域（全局/项目/现场/堆场/道路/区域/车辆级）和验证场景；不可配置能力若被要求配置化，应提示需要代码改造或能力扩展。
    default_work_hours_per_day: 8
