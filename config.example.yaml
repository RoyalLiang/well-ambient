# 本文件只包含不可用示例值。不要在仓库中保存真实 URL、账号、项目清单、JQL 或凭据。
database:
  # 本地开发默认 SQLite；正式 Linux 环境使用 deploy/config.production.example.yaml 的 setup 模式。
  driver: sqlite
  dsn: well-ambient.db
  auto_migrate: true
  max_open_connections: 4
  max_idle_connections: 2
  connection_max_lifetime_minutes: 0
  connection_max_idle_time_minutes: 0

server:
  host: 127.0.0.1
  port: 8080
  public_url: http://127.0.0.1:8080
  attachment_dir: ./data/demand-attachments

gitlab:
  enabled: false
  base_url: https://gitlab.example.com
  secret_token: ""
  api_token: ""
  repos:
    - name: example-service
      path: example-group/example-service
      project_id: "100"

feishu:
  enabled: false
  app_id: ""
  app_secret: ""
  bot:
    enabled: false
    chat_group: ""
  bitable:
    enabled: false
    app_token: ""
    table_id: ""
    status_column: ""
    task_id_column: ""

jira:
  enabled: false
  base_url: https://jira.example.com
  username: ""
  api_token: ""
  sync_projects: []
  sync_users: []
  sync_statuses: []
  custom_jql: ""
  version_sources: []

ai:
  enabled: false
  provider: openai
  base_url: https://api.example.com
  endpoint_type: responses
  api_token: ""
  model: example-model
  project_architecture: ""
  delivery_workflow: ""
  implemented_features: ""
  estimation_guidelines: ""
  default_work_hours_per_day: 8

performance_brain:
  enabled: false
  interval_minutes: 60
  assessment_window_days: 90
  retention_days: 90
  formula_version: v6.0
  publication_mode: shadow
  demand_metrics_enabled: true
  bug_metrics_enabled: true
  code_metrics_enabled: true
  jira_history_enabled: true
  git_dedupe_enabled: true
  evidence_coverage_gate: 0.70
  minimum_samples: 5
  minimum_exposure_days: 30
  busy_retry_attempts: 3
  busy_retry_delay_ms: 200

solution_catalog:
  interval_minutes: 30
  candidate_limit: 8
  recall_threshold: 0.18
