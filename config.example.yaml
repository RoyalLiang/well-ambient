# 本文件只包含不可用示例值。不要在仓库中保存真实 URL、账号、项目清单、JQL 或凭据。
database:
  # 本地测试默认进入受令牌保护的 PostgreSQL 安装页；令牌为空时，启动过程会生成一次性令牌和 owner-only 临时文件。
  driver: setup
  # 如需迁移旧库，填写停写快照的绝对路径；页面不能修改或读取任意路径。
  # legacy_sqlite_path: /absolute/path/to/well-ambient.db
  auto_migrate: false
  max_open_connections: 20
  max_idle_connections: 10
  connection_max_lifetime_minutes: 30
  connection_max_idle_time_minutes: 5

server:
  host: 127.0.0.1
  port: 8080
  public_url: http://127.0.0.1:8080
  attachment_dir: ./data/demand-attachments

gitlab:
  enabled: false
  base_url: https://gitlab.example.com
  secret_token: ""
  api_token: ""
  repos:
    - name: example-service
      path: example-group/example-service
      project_id: "100"

feishu:
  enabled: false
  app_id: ""
  app_secret: ""
  bot:
    enabled: false
    chat_group: ""
  bitable:
    enabled: false
    app_token: ""
    table_id: ""
    status_column: ""
    task_id_column: ""

jira:
  enabled: false
  base_url: https://jira.example.com
  username: ""
  api_token: ""
  sync_projects: []
  sync_users: []
  sync_statuses: []
  custom_jql: ""
  version_sources: []

ai:
  enabled: false
  provider: openai
  base_url: https://api.example.com
  endpoint_type: responses
  api_token: ""
  model: example-model
  project_architecture: ""
  delivery_workflow: ""
  implemented_features: ""
  estimation_guidelines: ""
  default_work_hours_per_day: 8

performance_brain:
  enabled: false
  interval_minutes: 60
  assessment_window_days: 90
  retention_days: 90
  formula_version: v6.0
  publication_mode: shadow
  demand_metrics_enabled: true
  bug_metrics_enabled: true
  code_metrics_enabled: true
  jira_history_enabled: true
  git_dedupe_enabled: true
  evidence_coverage_gate: 0.70
  minimum_samples: 5
  minimum_exposure_days: 30
  busy_retry_attempts: 3
  busy_retry_delay_ms: 200

# 配置中心的“邮件服务”可保存下列设置，密码不在读取接口或历史版本中返回原文。
smtp:
  enabled: false
  host: smtp.example.com
  port: 587
  tls_mode: starttls # starttls / tls；none 仅限本机无认证测试
  username: ""
  password: ""
  from: reports@example.com

daily_jira_email:
  enabled: false
  recipients: []
  timezone: Asia/Shanghai
  send_time: "09:00"
  include_commits: false
  confluence:
    enabled: false
    parent_page_url: "https://confluence.westwell-lab.com/display/~zhiyuan_liang/well-infra"
    token: ""
  template:
    style: brief # brief / focus / ledger
    subject: "Jira 每日早报 · {{date}}"
    introduction: "各位早上好，以下为 {{date}} 的研发早报（{{timezone}}）。请结合状态分布与负责人统计，优先关注近三天新建且仍未解决的事项。"
    closing: "请相关负责人核对待办事项、明确下一步计划，并及时更新 Jira 状态。统计基于本地同步记录；如有缺失，请先检查同步与人员映射。"

solution_catalog:
  interval_minutes: 30
  candidate_limit: 8
  recall_threshold: 0.18
