name: well-ambient

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "5"

services:
  migrate:
    image: ${WELL_AMBIENT_SERVER_IMAGE:?WELL_AMBIENT_SERVER_IMAGE is required}:${WELL_AMBIENT_VERSION:?WELL_AMBIENT_VERSION is required}
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    command: ["--config", "/etc/well-ambient/config.yaml", "--migrate-only"]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./deploy/runtime:/etc/well-ambient
      - ./deploy/runtime/data:/var/lib/well-ambient
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging: *default-logging
    networks: [ambient]

  server:
    image: ${WELL_AMBIENT_SERVER_IMAGE:?WELL_AMBIENT_SERVER_IMAGE is required}:${WELL_AMBIENT_VERSION:?WELL_AMBIENT_VERSION is required}
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    command: ["--config", "/etc/well-ambient/config.yaml", "--skip-migrate"]
    environment:
      WELL_AMBIENT_SETUP_TOKEN: ${WELL_AMBIENT_SETUP_TOKEN:-}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # Mount the directory, not one file, so owner-only atomic config replacement works.
      - ./deploy/runtime:/etc/well-ambient
      - ./deploy/runtime/data:/var/lib/well-ambient
    healthcheck:
      test: ["CMD", "/usr/local/bin/well-ambient", "--healthcheck-url", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    tmpfs:
      - /tmp:size=128m,mode=1777
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *default-logging
    networks: [ambient]

  web:
    image: ${WELL_AMBIENT_WEB_IMAGE:?WELL_AMBIENT_WEB_IMAGE is required}:${WELL_AMBIENT_VERSION:?WELL_AMBIENT_VERSION is required}
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -s /usr/share/nginx/html/index.html"]
      interval: 10s
      timeout: 3s
      retries: 12
    read_only: true
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /var/cache/nginx:size=64m
      - /var/run:size=8m
      - /tmp:size=32m
    restart: unless-stopped
    logging: *default-logging
    networks: [ambient]

networks:
  ambient:
    driver: bridge
